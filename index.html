<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>InclusionMatrimony</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    
    <!-- 🌓 NAYA DARK MODE BUTTON -->
    <button onclick="toggleDarkMode()" style="position: absolute; top: 20px; right: 40px; background-color: #333; color: white; padding: 10px 15px; border-radius: 20px; border: 2px solid #555;">🌓 Dark Mode</button>

    <h2>👩‍❤️‍👨 InclusionMatrimony - Profile Data</h2>
    
    <div class="form-container" style="max-width: 500px;">
        <form id="addForm">
            <input type="hidden" id="userId" value="">

            <label>Apna Naam:</label>
            <input type="text" id="nameInput" required placeholder="Naam likhein...">
            
            <label>Email ID:</label>
            <input type="email" id="emailInput" required placeholder="Email likhein...">

            <label>Umar (Age):</label>
            <input type="number" id="ageInput" required placeholder="Umar (Jaise: 25)" min="18" max="100">

            <label>Gender:</label>
            <select id="genderInput" required>
                <option value="">Select Gender...</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>

            <label>Disability Type (Agar hai toh):</label>
            <select id="disabilityInput" required>
                <option value="">Select Type...</option>
                <option value="None">None (Koi nahi)</option>
                <option value="Visual Impairment">Visual Impairment (Dekhne me samasya)</option>
                <option value="Hearing Impairment">Hearing Impairment (Sunne me samasya)</option>
                <option value="Physical/Mobility">Physical/Mobility (Chalne me samasya)</option>
                <option value="Other">Other</option>
            </select>
            
            <button id="submitBtn" class="btn-green" type="submit">Save Profile</button>
        </form>
    </div>

    <h2>📊 Matrimony Database</h2>
    
    <input type="text" id="searchInput" class="search-box" onkeyup="searchTable()" placeholder="🔍 Naam, Email ya Disability se dhundhein...">
    
    <button onclick="downloadExcel()" class="btn-green" style="margin-bottom: 20px; background-color: #20c997; width: auto;">📥 Download Profiles as Excel</button>
    
    <table id="usersTable">
        <tr style="background-color: #1a73e8; color: white;">
            <th>Sr. No.</th>
            <th>Name</th>
            <th>Email</th>
            <th>Age</th>
            <th>Gender</th>
            <th>Disability Type</th>
            <th>Action</th>
        </tr>
    </table>

    <script>
        // 🌓 DARK MODE FUNCTION
        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
        }

        function loadData() {
            fetch('/api/users')
                .then(response => response.json())
                .then(data => {
                    const table = document.getElementById('usersTable');
                    table.innerHTML = '<tr style="background-color: #1a73e8; color: white;"><th>Sr. No.</th><th>Name</th><th>Email</th><th>Age</th><th>Gender</th><th>Disability Type</th><th>Action</th></tr>';
                    
                    let serialNumber = 1; 
                    
                    data.forEach(user => {
                        table.innerHTML += "<tr>" + 
                            "<td>" + serialNumber + "</td>" + 
                            "<td>" + user.name + "</td>" + 
                            "<td>" + user.email + "</td>" + 
                            "<td>" + user.age + "</td>" + 
                            "<td>" + user.gender + "</td>" + 
                            "<td>" + user.disability_type + "</td>" + 
                            "<td>" + 
                                "<button onclick=\"speakProfile('" + user.name + "', '" + user.age + "', '" + user.gender + "', '" + user.disability_type + "')\" class='btn-blue' style='background-color: #17a2b8;'>🔊 Suno</button>" +
                                "<button onclick=\"editUser(" + user.id + ", '" + user.name + "', '" + user.email + "', '" + user.age + "', '" + user.gender + "', '" + user.disability_type + "')\" class='btn-blue'>Edit</button>" + 
                                "<button onclick='deleteUser(" + user.id + ")' class='btn-red'>Delete</button>" + 
                            "</td>" + 
                            "</tr>";
                        serialNumber++; 
                    });
                });
        }

        function speakProfile(name, age, gender, disability) {
            window.speechSynthesis.cancel();
            let textToSpeak = "Profile of " + name + ". Age " + age + ". Gender " + gender + ". Disability type is " + disability;
            let speech = new SpeechSynthesisUtterance(textToSpeak);
            speech.rate = 0.9; 
            window.speechSynthesis.speak(speech);
        }

        function searchTable() {
            let input = document.getElementById("searchInput").value.toLowerCase();
            let table = document.getElementById("usersTable");
            let tr = table.getElementsByTagName("tr");

            for (let i = 1; i < tr.length; i++) {
                let nameCol = tr[i].getElementsByTagName("td")[1];
                let emailCol = tr[i].getElementsByTagName("td")[2];
                let disabilityCol = tr[i].getElementsByTagName("td")[5];
                
                if (nameCol || emailCol || disabilityCol) {
                    let textToSearch = (nameCol.innerText + " " + emailCol.innerText + " " + disabilityCol.innerText).toLowerCase();
                    if (textToSearch.indexOf(input) > -1) {
                        tr[i].style.display = "";
                    } else {
                        tr[i].style.display = "none";
                    }
                }
            }
        }

        function editUser(id, name, email, age, gender, disability) {
            document.getElementById("userId").value = id;
            document.getElementById("nameInput").value = name;
            document.getElementById("emailInput").value = email;
            document.getElementById("ageInput").value = age;
            document.getElementById("genderInput").value = gender;
            document.getElementById("disabilityInput").value = disability;
            
            const btn = document.getElementById("submitBtn");
            btn.innerText = "Update Profile";
            btn.className = "btn-orange";
        }

        function deleteUser(dbId) {
            if(confirm("Kya aap sach me is profile ko delete karna chahte hain?")) {
                fetch('/api/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: dbId }) 
                })
                .then(response => response.json())
                .then(result => {
                    loadData(); 
                });
            }
        }

        document.getElementById("addForm").addEventListener("submit", function(event) {
            event.preventDefault();
            const userId = document.getElementById("userId").value;
            const inputName = document.getElementById("nameInput").value;
            const inputEmail = document.getElementById("emailInput").value;
            const inputAge = document.getElementById("ageInput").value;
            const inputGender = document.getElementById("genderInput").value;
            const inputDisability = document.getElementById("disabilityInput").value;
            
            let apiUrl = '/api/register';
            if (userId !== "") { apiUrl = '/api/update'; }
            
            fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    id: String(userId), 
                    name: inputName, 
                    email: inputEmail,
                    age: inputAge,
                    gender: inputGender,
                    disability_type: inputDisability
                })
            })
            .then(response => response.json())
            .then(result => {
                alert(result.message);
                if(result.status === "success") {
                    document.getElementById("addForm").reset();
                    document.getElementById("userId").value = "";
                    const btn = document.getElementById("submitBtn");
                    btn.innerText = "Save Profile";
                    btn.className = "btn-green";
                    loadData();
                }
            });
        });

        function downloadExcel() {
            window.location.href = '/api/export';
        }

        loadData();
    </script>
</body>
</html>
