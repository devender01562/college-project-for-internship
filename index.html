<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>VisionCompanion - IoT Dashboard</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <button onclick="toggleDarkMode()" style="position: absolute; top: 20px; right: 40px; background-color: #333; color: white; padding: 10px 15px; border-radius: 20px; border: 2px solid #555; cursor: pointer;">🌓 Dark Mode</button>

    <h2>🕶️ VisionCompanion - Device Management</h2>
    
    <div class="form-container" style="max-width: 550px;">
        <form id="addForm">
            <input type="hidden" id="userId" value="">

            <label>Owner Name (User ka naam):</label>
            <input type="text" id="ownerInput" required placeholder="User ka naam...">
            
            <label>Device ID:</label>
            <input type="text" id="deviceIdInput" required placeholder="Eg: VC-001">

            <label>Battery Level (%):</label>
            <input type="number" id="batteryInput" required placeholder="Eg: 85" min="0" max="100">

            <label>Device Status:</label>
            <select id="statusInput" required>
                <option value="">Select Status...</option>
                <option value="Active">🟢 Active (Chal raha hai)</option>
                <option value="Offline">🔴 Offline (Band hai)</option>
                <option value="Needs Repair">🟡 Needs Repair (Kharab hai)</option>
            </select>

            <label>Emergency Contact No:</label>
            <input type="text" id="emergencyInput" required placeholder="Mobile number..." maxlength="10">
            
            <button id="submitBtn" class="btn-green" type="submit">Register Device</button>
        </form>
    </div>

    <h2>📊 Connected Devices Network</h2>
    
    <input type="text" id="searchInput" class="search-box" onkeyup="searchTable()" placeholder="🔍 Device ID ya Owner Name se dhundhein...">
    
    <button onclick="downloadExcel()" class="btn-green" style="margin-bottom: 20px; background-color: #16a085; width: auto;">📥 Download Logs (Excel)</button>
    
    <table id="usersTable">
        <tr>
            <th>Sr. No.</th>
            <th>Owner Name</th>
            <th>Device ID</th>
            <th>Battery</th>
            <th>Status</th>
            <th>Emergency Contact</th>
            <th>Action</th>
        </tr>
    </table>

    <script>
        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
        }

        function loadData() {
            fetch('/api/users')
                .then(response => response.json())
                .then(data => {
                    const table = document.getElementById('usersTable');
                    table.innerHTML = '<tr><th>Sr. No.</th><th>Owner Name</th><th>Device ID</th><th>Battery</th><th>Status</th><th>Emergency Contact</th><th>Action</th></tr>';
                    
                    let serialNumber = 1; 
                    
                    data.forEach(device => {
                        let statusIcon = device.status === 'Active' ? '🟢' : (device.status === 'Offline' ? '🔴' : '🟡');
                        table.innerHTML += "<tr>" + 
                            "<td>" + serialNumber + "</td>" + 
                            "<td>" + device.owner_name + "</td>" + 
                            "<td><strong>" + device.device_id + "</strong></td>" + 
                            "<td>" + device.battery + "%</td>" + 
                            "<td>" + statusIcon + " " + device.status + "</td>" + 
                            "<td>" + device.emergency_contact + "</td>" + 
                            "<td>" + 
                                "<button onclick=\"speakStatus('" + device.device_id + "', '" + device.owner_name + "', '" + device.battery + "', '" + device.status + "')\" class='btn-blue' style='background-color: #8e44ad;'>🔊 Audio Status</button>" +
                                "<button onclick=\"editUser(" + device.id + ", '" + device.owner_name + "', '" + device.device_id + "', '" + device.battery + "', '" + device.status + "', '" + device.emergency_contact + "')\" class='btn-blue'>Edit</button>" + 
                                "<button onclick='deleteUser(" + device.id + ")' class='btn-red'>Delete</button>" + 
                            "</td>" + 
                            "</tr>";
                        serialNumber++; 
                    });
                });
        }

        function speakStatus(deviceId, owner, battery, status) {
            window.speechSynthesis.cancel();
            let textToSpeak = "Status for Device " + deviceId + ". Owner is " + owner + ". Battery level is " + battery + " percent. Device is currently " + status + ".";
            let speech = new SpeechSynthesisUtterance(textToSpeak);
            speech.rate = 0.9; 
            window.speechSynthesis.speak(speech);
        }

        function searchTable() {
            let input = document.getElementById("searchInput").value.toLowerCase();
            let table = document.getElementById("usersTable");
            let tr = table.getElementsByTagName("tr");

            for (let i = 1; i < tr.length; i++) {
                let ownerCol = tr[i].getElementsByTagName("td")[1];
                let deviceCol = tr[i].getElementsByTagName("td")[2];
                
                if (ownerCol || deviceCol) {
                    let textToSearch = (ownerCol.innerText + " " + deviceCol.innerText).toLowerCase();
                    if (textToSearch.indexOf(input) > -1) {
                        tr[i].style.display = "";
                    } else {
                        tr[i].style.display = "none";
                    }
                }
            }
        }

        function editUser(id, owner, deviceId, battery, status, emergency) {
            document.getElementById("userId").value = id;
            document.getElementById("ownerInput").value = owner;
            document.getElementById("deviceIdInput").value = deviceId;
            document.getElementById("batteryInput").value = battery;
            document.getElementById("statusInput").value = status;
            document.getElementById("emergencyInput").value = emergency;
            
            const btn = document.getElementById("submitBtn");
            btn.innerText = "Update Device";
            btn.className = "btn-orange";
        }

        function deleteUser(dbId) {
            if(confirm("Are you sure you want to remove this device?")) {
                fetch('/api/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: dbId }) 
                })
                .then(response => response.json())
                .then(result => {
                    loadData(); 
                });
            }
        }

        document.getElementById("addForm").addEventListener("submit", function(event) {
            event.preventDefault();
            const userId = document.getElementById("userId").value;
            const inputOwner = document.getElementById("ownerInput").value;
            const inputDeviceId = document.getElementById("deviceIdInput").value;
            const inputBattery = document.getElementById("batteryInput").value;
            const inputStatus = document.getElementById("statusInput").value;
            const inputEmergency = document.getElementById("emergencyInput").value;
            
            let apiUrl = '/api/register';
            if (userId !== "") { apiUrl = '/api/update'; }
            
            fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    id: String(userId), 
                    owner_name: inputOwner, 
                    device_id: inputDeviceId,
                    battery: inputBattery,
                    status: inputStatus,
                    emergency_contact: inputEmergency
                })
            })
            .then(response => response.json())
            .then(result => {
                alert(result.message);
                if(result.status === "success") {
                    document.getElementById("addForm").reset();
                    document.getElementById("userId").value = "";
                    const btn = document.getElementById("submitBtn");
                    btn.innerText = "Register Device";
                    btn.className = "btn-green";
                    loadData();
                }
            });
        });

        function downloadExcel() {
            window.location.href = '/api/export';
        }

        loadData();
    </script>
</body>
</html>
